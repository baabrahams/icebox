<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icebox - Legal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.7; color: #1a1a1a; background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; padding: 48px 24px; }
    h1 { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
    .tagline { color: #666; font-size: 18px; margin-bottom: 40px; }
    .links { display: flex; gap: 24px; justify-content: center; }
    a { color: #2563eb; text-decoration: none; font-size: 18px; padding: 12px 24px; border: 1px solid #e5e5e5; border-radius: 8px; transition: border-color 0.2s; }
    a:hover { border-color: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Icebox</h1>
    <p class="tagline">Your SMS dinner assistant</p>
    <div class="links">
      <a href="/terms">Terms of Service</a>
      <a href="/privacy">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
